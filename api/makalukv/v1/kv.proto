syntax = "proto3";

package makalukv.v1;

option go_package = "github.com/georgikolev17/MakaluKV/api/makalukv/v1";

service KeyValueService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CompareAndSwapRequest) returns (CompareAndSwapResponse);
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
}

message CompareAndSwapRequest {
  bytes key = 1;
  bytes expected_value = 2;
  bytes new_value = 3;
}

message CompareAndSwapResponse {
  CompareAndSwapResult result = 1;
}

// Mainly used to distinguish between key not found and value mismatch in CompareAndSwapResponse.
enum CompareAndSwapResult {
  COMPARE_AND_SWAP_RESULT_UNSPECIFIED = 0;
  COMPARE_AND_SWAP_RESULT_SWAPPED = 1;
  COMPARE_AND_SWAP_RESULT_KEY_NOT_FOUND = 2;
  COMPARE_AND_SWAP_RESULT_VALUE_MISMATCH = 3;
}
